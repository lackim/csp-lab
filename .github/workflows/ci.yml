name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.16'
      - run: uv python install 3.14
      - run: uv sync --locked --python 3.14
      - run: uv run --locked pytest -q

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.16'
      - run: uv python install 3.10
      - run: uv sync --locked --python 3.10
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src/csp_lab tests examples/custom-node/tests
      - run: uv run --locked mypy src/csp_lab
      - run: bash test/wheel.sh
      - run: bash test/native-bounds.sh
      - run: bash test/integration.sh
