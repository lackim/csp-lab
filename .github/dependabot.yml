version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/", "/examples/custom-node"]
    schedule:
      interval: monthly
    groups:
      base-image:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      # Major versions arrive as separate pull requests: they can change APIs
      # and widen the upper bounds in pyproject.toml.
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
