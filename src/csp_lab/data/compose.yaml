services:
  hub:
    image: ${CSP_LAB_IMAGE:?}
    entrypoint: ["/usr/local/bin/zmqproxy"]
    command: ["-v", "${CSP_VERSION:-2}"]
  node2:
    image: ${CSP_LAB_IMAGE:?}
    depends_on: [hub]
    command: ["server", "${CSP_VERSION:-2}", "2", "hub"]
  node3:
    image: ${CSP_LAB_IMAGE:?}
    depends_on: [hub]
    command: ["server", "${CSP_VERSION:-2}", "3", "hub"]
  probe:
    image: ${CSP_LAB_IMAGE:?}
    profiles: ["tools"]
