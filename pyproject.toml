[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csp-lab"
version = "0.1.0"
description = "A local CubeSat Space Protocol lab powered by libcsp"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "mcp>=1.20,<2",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.scripts]
csp-lab = "csp_lab.cli:run_cli"

[project.optional-dependencies]
pytest = ["pytest>=8,<10"]

[project.entry-points.pytest11]
csp_lab = "csp_lab.pytest_plugin"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/csp_lab"]

[tool.hatch.build.targets.sdist]
only-include = ["src/csp_lab", "THIRD_PARTY_NOTICES.md", "docs/versioning.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "S602", "S605"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/csp_lab"]
